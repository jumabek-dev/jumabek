[package]
name = "telegram_bot"
description = "Talk to JumaBek from a phone, through a Telegram bot"
version = "1.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/jumabek-dev/jumabek"

[dependencies]
jumabek_sdk = { path = "../../jumabek_sdk" }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
