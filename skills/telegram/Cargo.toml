[package]
name = "telegram"
description = "Telegram user account over MTProto: dialogs, history, sending"
version = "1.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/jumabek-dev/jumabek"

[dependencies]
jumabek_sdk = { path = "../../jumabek_sdk" }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
# Pinned deliberately. In 0.6.5 `InputMessage::markdown` moved behind the
# `parsers` feature, and that feature cannot resolve — it asks for
# `ferogram-parsers ^0.6.5`, which was never published. So 0.6.5 offers no way
# to send formatted text at all. Being outside the workspace is what let this
# sit here unnoticed; revisit when 0.6.6 lands.
ferogram = "=0.6.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
chrono = "0.4"
