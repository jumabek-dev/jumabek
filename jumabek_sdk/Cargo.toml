[package]
name = "jumabek_sdk"
description = "Types and runtime for writing JumaBek skills"
version = "1.5.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jumabek-dev/jumabek"

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread"] }