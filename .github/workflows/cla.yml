name: cla

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, closed]

jobs:
  cla:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - name: check or record the signature
        # Only acts on PRs and on the one comment that signs; every other comment is ignored.
        if: >
          (github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')
          || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Signatures live on a branch of this repository, so there is no second
          # repo to keep in sync and no personal token to leak.
          branch: cla-signatures
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/jumabek-dev/jumabek/blob/main/CONTRIBUTING.md
          custom-notsigned-prcomment: >
            Thanks for the pull request. This project needs a Contributor License
            Agreement before it can merge — it is what keeps the option of adjusting
            the license split later without tracking down every past contributor.
            The reasoning is in CONTRIBUTING.md.


            To sign, comment on this pull request with exactly:
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-allsigned-prcomment: "Signed. Thanks — on to the review."
          lock-pullrequest-aftermerge: false
