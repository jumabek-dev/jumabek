name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          cache-on-failure: true

      - name: formatting
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          cache-on-failure: true

      # Skills can be written in Python and Node, and the tests that cover that
      # path build and run a real one. The runners ship both already; pinning
      # them is what makes the coverage a fact rather than a coincidence — a
      # runner without an interpreter would skip those tests and still go green.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Several tests drive the real shell_executor binary, so it has to exist first.
      - name: build
        run: cargo build --workspace --locked

      - name: build with retrieval
        if: runner.os == 'Linux'
        run: cargo build --locked --features retrieval

      - name: test
        run: cargo test --workspace --locked
