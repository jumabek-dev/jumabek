[workspace]
members = [
    "jumabek_sdk",
    "skills/shell_executor",
    "skills/telegram",
    "skills/telegram_bot",
    "skills/searxng_search",
]

[workspace.package]
version = "1.5.0"
edition = "2024"
repository = "https://github.com/jumabek-dev/jumabek"

[package]
name = "jumabek"
description = "An assistant that writes its own skills when it runs out of them"
readme = "README.md"
version.workspace = true
edition.workspace = true
license = "AGPL-3.0-only"
repository.workspace = true

[dependencies]
jumabek_sdk = { path = "jumabek_sdk" }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
async-trait = "0.1"
rustyline = "14"
colored = "2"
terminal_size = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
rust-stemmers = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tiktoken-rs = "0.6"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
cron = "0.12"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Cargo ignores a `[profile]` in a workspace member, so the skills' own
# `strip = true` was silently doing nothing once they joined the workspace.
[profile.release]
strip = true
